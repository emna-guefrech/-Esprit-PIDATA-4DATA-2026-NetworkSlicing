version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: anomaly_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: network_slicing
      MYSQL_USER: anomaly_user
      MYSQL_PASSWORD: anomaly_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./network_slicing.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Anomaly Detection Service
  anomaly-service:
    build: .
    container_name: anomaly_service
    restart: always
    environment:
      FLASK_ENV: production
      FLASK_DEBUG: false
      FLASK_HOST: 0.0.0.0
      FLASK_PORT: 5000
      DATABASE_URL: mysql+pymysql://anomaly_user:anomaly_password@mysql:3306/network_slicing
      SECRET_KEY: production-secret-key-change-this
    ports:
      - "5000:5000"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./models:/app/models
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/anomaly/stats"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Nginx Reverse Proxy (optional)
  nginx:
    image: nginx:latest
    container_name: anomaly_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - anomaly-service
    networks:
      - default

volumes:
  mysql_data:

networks:
  default:
    driver: bridge
