version: '3.8'

# ══════════════════════════════════════════════════════════════════
# Integrated Network Slicing MLOps Platform
# All 5 microservices + shared MySQL + nginx gateway
# ══════════════════════════════════════════════════════════════════

services:

  # ── Shared MySQL ───────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: mlops_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: network_slicing
    ports:
      - "3306:3306"
    volumes:
      - mlops_mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - mlops_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ── MS-1 Prediction & QoS ─────────────────────────────────────
  ms1:
    build:
      context: ./ms1
      dockerfile: Dockerfile
    container_name: mlops_ms1
    ports:
      - "5001:5001"
    environment:
      DB_USER: root
      DB_PASS: root
      DB_HOST: mysql
      DB_NAME: network_slicing
      MS2_URL: http://ms2:5002
      MS3_URL: http://ms3:5003
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - mlops_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:5001/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── MS-2 Anomaly Detection ────────────────────────────────────
  ms2:
    build:
      context: ./ms2
      dockerfile: Dockerfile
    container_name: mlops_ms2
    ports:
      - "5002:5002"
    environment:
      DB_USER: root
      DB_PASS: root
      DB_HOST: mysql
      DB_NAME: network_slicing
      MS3_URL: http://ms3:5003
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - mlops_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:5002/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── MS-3 Dashboard & Alerts ───────────────────────────────────
  ms3:
    build:
      context: ./ms3
      dockerfile: Dockerfile
    container_name: mlops_ms3
    ports:
      - "5003:5003"
    environment:
      DB_USER: root
      DB_PASS: root
      DB_HOST: mysql
      DB_NAME: network_slicing
      MS1_URL: http://ms1:5001
      MS2_URL: http://ms2:5002
    depends_on:
      mysql:
        condition: service_healthy
      ms1:
        condition: service_started
      ms2:
        condition: service_started
    networks:
      - mlops_network
    restart: unless-stopped

  # ── MS-4 Auth & Admin ─────────────────────────────────────────
  ms4:
    build:
      context: ./ms4
      dockerfile: Dockerfile
    container_name: mlops_ms4
    ports:
      - "5004:5004"
    environment:
      DB_USER: root
      DB_PASS: root
      DB_HOST: mysql
      DB_NAME: network_slicing
      MS1_URL: http://ms1:5001
      MS2_URL: http://ms2:5002
      MS3_URL: http://ms3:5003
      MS5_URL: http://ms5:5005
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - mlops_network
    restart: unless-stopped

  # ── MS-5 Model Management ─────────────────────────────────────
  ms5:
    build:
      context: ./ms5
      dockerfile: Dockerfile
    container_name: mlops_ms5
    ports:
      - "5005:5005"
    environment:
      DB_USER: root
      DB_PASS: root
      DB_HOST: mysql
      DB_NAME: network_slicing
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - mlops_network
    restart: unless-stopped

  # ── nginx API Gateway ─────────────────────────────────────────
  gateway:
    image: nginx:alpine
    container_name: mlops_gateway
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - ms1
      - ms2
      - ms3
      - ms4
      - ms5
    networks:
      - mlops_network
    restart: unless-stopped

volumes:
  mlops_mysql_data:
    driver: local

networks:
  mlops_network:
    driver: bridge
    name: mlops_network
