# ══════════════════════════════════════════════════════════════════
# nginx.conf — Unified API Gateway for Network Slicing MLOps
# Routes all MS requests through port 80
# ══════════════════════════════════════════════════════════════════

upstream ms1 { server ms1:5001; }
upstream ms2 { server ms2:5002; }
upstream ms3 { server ms3:5003; }
upstream ms4 { server ms4:5004; }
upstream ms5 { server ms5:5005; }

server {
    listen 80;
    server_name localhost;

    # ── MS-4 Auth (login page = root) ──────────────────────────────
    location / {
        proxy_pass         http://ms4;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── MS-1 Prediction ────────────────────────────────────────────
    location /ms1/ {
        rewrite            ^/ms1/(.*)$ /$1 break;
        proxy_pass         http://ms1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        add_header         'Access-Control-Allow-Origin' '*';
        add_header         'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
        add_header         'Access-Control-Allow-Headers' 'Content-Type';
    }

    # ── MS-2 Anomaly ───────────────────────────────────────────────
    location /ms2/ {
        rewrite            ^/ms2/(.*)$ /$1 break;
        proxy_pass         http://ms2;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        add_header         'Access-Control-Allow-Origin' '*';
    }

    # ── MS-3 Dashboard ─────────────────────────────────────────────
    location /ms3/ {
        rewrite            ^/ms3/(.*)$ /$1 break;
        proxy_pass         http://ms3;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        add_header         'Access-Control-Allow-Origin' '*';
    }

    # ── MS-5 Model Management ──────────────────────────────────────
    location /ms5/ {
        rewrite            ^/ms5/(.*)$ /$1 break;
        proxy_pass         http://ms5;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        add_header         'Access-Control-Allow-Origin' '*';
    }

    # ── Health check ───────────────────────────────────────────────
    location /gateway/health {
        return 200 '{"status":"gateway running","ms":["ms1","ms2","ms3","ms4","ms5"]}';
        add_header Content-Type application/json;
    }
}
