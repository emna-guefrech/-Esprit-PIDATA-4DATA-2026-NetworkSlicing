<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MS-3 NOC Dashboard{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', sans-serif; }
        .main-bg {
            background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 50%, #7dd3fc 100%);
            min-height: 100vh;
        }
        .card-style {
            background: rgba(255,255,255,0.95);
            border: 1px solid rgba(147,197,253,0.3);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            backdrop-filter: blur(8px);
        }
        .button-primary {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            transition: all 0.2s ease;
        }
        .button-primary:hover { transform: translateY(-1px); }
        .nav-link { transition: all 0.2s; }
        .nav-link:hover { background: rgba(255,255,255,0.2); border-radius: 8px; }
        .nav-link.active { background: rgba(255,255,255,0.3); border-radius: 8px; font-weight: 600; }
        @keyframes pulse-red {
            0%,100% { background-color: rgba(239,68,68,0.1); }
            50%      { background-color: rgba(239,68,68,0.2); }
        }
        @keyframes pulse-yellow {
            0%,100% { background-color: rgba(245,158,11,0.1); }
            50%      { background-color: rgba(245,158,11,0.2); }
        }
        .alert-critical { animation: pulse-red 2s infinite; }
        .alert-warn     { animation: pulse-yellow 2s infinite; }
        .badge-critical { background: #fee2e2; color: #991b1b; }
        .badge-warn     { background: #fef9c3; color: #854d0e; }
        .badge-normal   { background: #dcfce7; color: #166534; }
    </style>
</head>
<body class="main-bg text-gray-800">
    <nav class="bg-gradient-to-r from-indigo-900 to-indigo-700 text-white px-6 py-4 shadow-lg">
        <div class="container mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <span class="text-2xl">🖥️</span>
                <div>
                    <h1 class="text-xl font-bold">Network Slicing NOC</h1>
                    <p class="text-indigo-200 text-xs">MS-3 — Dashboard & Alerts Service</p>
                </div>
            </div>
            <div class="flex items-center space-x-1">
                <a href="/" class="nav-link px-3 py-2 text-sm {% if request.path == '/' %}active{% endif %}">
                    📊 Dashboard
                </a>
                <a href="/alerts" class="nav-link px-3 py-2 text-sm {% if request.path == '/alerts' %}active{% endif %}">
                    🚨 Alerts
                </a>
                <a href="/dashboard/slices" class="nav-link px-3 py-2 text-sm" target="_blank">
                    📡 Slices API
                </a>
                <a href="/health" class="nav-link px-3 py-2 text-sm" target="_blank">
                    ❤️ Health
                </a>
                <!-- MS links -->
                <a href="{{ ms1_url if ms1_url is defined else 'http://localhost:5001' }}"
                   class="nav-link px-3 py-2 text-sm bg-blue-700 rounded-lg" target="_blank">
                    MS-1
                </a>
                <a href="{{ ms2_url if ms2_url is defined else 'http://localhost:5002' }}"
                   class="nav-link px-3 py-2 text-sm bg-red-700 rounded-lg" target="_blank">
                    MS-2
                </a>
            </div>
        </div>
    </nav>
    <div class="container mx-auto px-4 py-6">
        {% block content %}{% endblock %}
    </div>
    {% block scripts %}{% endblock %}
</body>
</html>
