version: '3.8'

services:

  mysql:
    image: mysql:8.0
    container_name: ms5_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: network_slicing
    ports:
      - "3310:3306"
    volumes:
      - ms5_mysql_data:/var/lib/mysql
    networks:
      - ms5_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: ms5_app
    ports:
      - "5005:5005"
    environment:
      DB_USER: root
      DB_PASS: root
      DB_HOST: mysql
      DB_NAME: network_slicing
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - ms5_network
    restart: unless-stopped

volumes:
  ms5_mysql_data:

networks:
  ms5_network:
    driver: bridge
