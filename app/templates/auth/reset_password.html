{% extends "base.html" %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <i class="fas fa-key"></i>
            <h2>Réinitialiser le mot de passe</h2>
        </div>
        
        <p style="text-align: center; color: #666; margin-bottom: 1.5rem;">
            Créez un nouveau mot de passe pour votre compte
        </p>
        
        <form method="POST" action="{{ url_for('auth.reset_password', token=token) }}" class="auth-form">
            <!-- New Password -->
            <div class="form-group">
                <label for="password">Nouveau mot de passe</label>
                <input type="password" id="password" name="password" class="form-control" 
                       placeholder="Minimum 12 caractères" required>
                <small class="form-text text-muted">Minimum 12 caractères</small>
            </div>

            <!-- Confirm Password -->
            <div class="form-group">
                <label for="confirm_password">Confirmer le mot de passe</label>
                <input type="password" id="confirm_password" name="confirm_password" class="form-control" 
                       placeholder="Confirmez votre mot de passe" required>
            </div>

            <!-- Info Box -->
            <div class="alert alert-info" role="alert">
                <i class="fas fa-lock"></i>
                Assurez-vous d'utiliser un mot de passe fort et unique.
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn btn-primary btn-block">
                <i class="fas fa-check"></i> Réinitialiser le mot de passe
            </button>
        </form>

        <!-- Back to login -->
        <div class="auth-footer">
            <p>Retour au <a href="{{ url_for('auth.login') }}">formulaire de connexion</a></p>
        </div>
    </div>
</div>

<style>
    body {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
    }

    .wrapper, .main-content {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .auth-container {
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100%;
    }

    .auth-card {
        background: white;
        border-radius: 12px;
        box-shadow: 0 15px 50px rgba(0, 0, 0, 0.2);
        width: 100%;
        max-width: 450px;
        padding: 2.5rem;
    }

    .auth-header {
        text-align: center;
        margin-bottom: 2.5rem;
    }

    .auth-header i {
        font-size: 3rem;
        color: #667eea;
        margin-bottom: 1rem;
        display: block;
    }

    .auth-header h2 {
        color: #333;
        font-size: 2rem;
        margin: 0;
        font-weight: 700;
    }

    .form-group {
        margin-bottom: 1.5rem;
    }

    .form-group label {
        font-weight: 600;
        color: #333;
        margin-bottom: 0.6rem;
        display: block;
    }

    .form-group .form-control {
        width: 100%;
        border: 1.5px solid #ddd;
        border-radius: 6px;
        padding: 0.85rem 1rem;
        font-size: 1rem;
    }

    .form-group .form-control:focus {
        outline: none;
        border-color: #667eea;
        box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    .form-text {
        font-size: 0.85rem;
        color: #999;
        margin-top: 0.4rem;
    }

    .btn-primary {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        border: none;
        color: white;
        padding: 0.95rem;
        font-weight: 600;
        border-radius: 6px;
        cursor: pointer;
        transition: all 0.3s ease;
        font-size: 1rem;
        width: 100%;
    }

    .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
    }

    .alert {
        padding: 1rem;
        border-radius: 6px;
        margin: 1.5rem 0;
        font-size: 0.9rem;
    }

    .alert-info {
        background-color: #f0f4ff;
        border: 1px solid #cce0ff;
        color: #004085;
    }

    .auth-footer {
        text-align: center;
        margin-top: 1.5rem;
        padding-top: 1.5rem;
        border-top: 1px solid #f0f0f0;
    }

    .auth-footer p {
        color: #666;
        font-size: 0.9rem;
        margin: 0;
    }

    .auth-footer a {
        color: #667eea;
        text-decoration: none;
        font-weight: 600;
    }

    .auth-footer a:hover {
        color: #764ba2;
    }
</style>
{% endblock %}
