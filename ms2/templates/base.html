<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MS-2 Anomaly Detection{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', sans-serif; }
        .main-bg {
            background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 50%, #7dd3fc 100%);
            min-height: 100vh;
        }
        .card-style {
            background: rgba(255,255,255,0.95);
            border: 1px solid rgba(147,197,253,0.3);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            backdrop-filter: blur(8px);
        }
        .button-primary {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            transition: all 0.2s ease;
        }
        .button-primary:hover {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            transform: translateY(-1px);
        }
        .nav-link { transition: all 0.2s; }
        .nav-link:hover { background: rgba(255,255,255,0.2); border-radius: 8px; }
        .nav-link.active { background: rgba(255,255,255,0.3); border-radius: 8px; font-weight: 600; }
        @keyframes pulse-red {
            0%,100% { background-color: rgba(239,68,68,0.1); }
            50%      { background-color: rgba(239,68,68,0.2); }
        }
        .alert-critical { animation: pulse-red 2s infinite; border-radius: 8px; }
        @keyframes pulse-yellow {
            0%,100% { background-color: rgba(245,158,11,0.1); }
            50%      { background-color: rgba(245,158,11,0.2); }
        }
        .alert-warn { animation: pulse-yellow 2s infinite; border-radius: 8px; }
    </style>
</head>
<body class="main-bg text-gray-800">
    <nav class="bg-gradient-to-r from-red-900 to-red-700 text-white px-6 py-4 shadow-lg">
        <div class="container mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <span class="text-2xl">🔍</span>
                <div>
                    <h1 class="text-xl font-bold">Network Slicing</h1>
                    <p class="text-red-200 text-xs">MS-2 — Anomaly Detection Service</p>
                </div>
            </div>
            <div class="flex items-center space-x-2">
                <a href="/" class="nav-link px-4 py-2 text-sm {% if request.path == '/' %}active{% endif %}">
                    📊 Dashboard
                </a>
                <a href="/history" class="nav-link px-4 py-2 text-sm {% if request.path == '/history' %}active{% endif %}">
                    📋 History
                </a>
                <a href="/anomaly/stats" class="nav-link px-4 py-2 text-sm" target="_blank">
                    📈 Stats
                </a>
                <a href="/health" class="nav-link px-4 py-2 text-sm" target="_blank">
                    ❤️ Health
                </a>
            </div>
        </div>
    </nav>
    <div class="container mx-auto px-4 py-6">
        {% block content %}{% endblock %}
    </div>
    {% block scripts %}{% endblock %}
</body>
</html>
